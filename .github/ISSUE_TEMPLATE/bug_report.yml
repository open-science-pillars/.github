name: Bug report
description: A skill, agent, notebook, or install behaves incorrectly.
labels: [bug]
body:
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Claude Code, Claude Cowork or OpenAI Codex (include the version when known); the capability's README says which runtimes a release is qualified on.
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Capability and skill
      placeholder: core / report
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked for, what you got, what you expected. Include the prompt verbatim where possible.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or transcript excerpt. For computational bugs, name the fixture or dataset (ShortName and date range).
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, relevant library versions.
