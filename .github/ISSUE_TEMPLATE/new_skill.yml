name: New skill proposal
description: Propose a new skill for an existing capability.
labels: [new-skill]
body:
  - type: markdown
    attributes:
      value: |
        The path from this issue to a merged pull request (where a skill lives, the frontmatter rules, what a workflow skill owes, what the gate runs) is the marketplace repository's [contributing-a-skill.md](https://github.com/open-science-pillars/marketplace/blob/main/docs/contributing-a-skill.md).
  - type: input
    id: plugin
    attributes:
      label: Target capability
      placeholder: core, ocean-science, hydrology
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Skill class
      description: Knowledge skills are background expertise (user-invocable false, with narrow exceptions); workflow skills act and keep both invocation paths open with in-skill gates for side effects.
      options:
        - knowledge
        - workflow
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What the skill knows or does; what it must NOT do; the confirmation gates if it has side effects.
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Draft frontmatter description
      description: 200 characters maximum, keyword-first.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: A workflow skill that encodes a computation needs a golden script in verification/ that runs green headless; describe the fixture and the assertions. A high-severity gotcha the skill cites needs an eval case.
